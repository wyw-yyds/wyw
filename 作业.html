<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网易新闻卡片</title>
    <style>
        body{
            background-color: #f4f4f4;
        }
        .card{
            width: 300px;
            margin: 50px auto 0;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 5px 5px 5px #ccc;
            background: #fff;
        }
        .card img{
            width: 300px;
            height: auto;
            margin-bottom: 10px;
        }
        .card h3{
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            position: relative;
            padding-left: 12px;
        }
        .card h3::before{
            content: "";
            position: absolute;
            left: 0;
            top: 2px;
            width: 3px;
            height: 18px;
            background-color: red;
        }
        .card p{
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            text-indent: 2em;
            position: relative;
        }
        .card p::after{
            content: "";
            display: block;
            width: 100%;
            height: 2px;
            background-color: #ffd700;
            margin-top: 10px;
        }
        .card a{
            font-size: 13px;
            color: #de2626;
            text-decoration: none;
            display: block;
            text-align: right;
            margin-top: 8px;
        }
        .card a:hover{
            text-decoration: underline;
            color: #b01e1e;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="./作业.jpg" alt="数字人民币">
        <h3>数字人民币突破困境全面加速</h3>
        <p>数字人民币由现金货币调整为存款货币，从根本上破解了此前的发展困境，叠加数字人民币技术架构和运行服务体系升级，正式进入全面加速发展阶段。</p>
        <a href="https://finance.sina.com.cn/zl/bank/2026-10-29/zl-iniwwyat8773586.shtml">阅读全文</a>
    </div>
</body>
</html>
